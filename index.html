<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipment Intake System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4">

  <div class="max-w-5xl mx-auto space-y-6">

    <!-- Header & Quick GAS Setup Bar -->
    <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Equipment Intake System</h1>
        <p class="text-xs text-slate-500">Register and manage equipment location and details.</p>
      </div>
      
      <!-- Compact GAS Connection Setting -->
      <div class="flex items-center space-x-2 bg-slate-50 p-2 rounded-lg border border-slate-200 text-xs">
        <span id="statusIndicator" class="w-2.5 h-2.5 rounded-full bg-emerald-500" title="Connected"></span>
        <input type="url" id="gasUrlInput" placeholder="Paste GAS Web App URL here..." 
          class="px-2 py-1 border border-slate-300 rounded text-xs w-64 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
        <button onclick="saveGasUrl()" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded transition">
          Update
        </button>
      </div>
    </header>

    <!-- Main Intake Form -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-base font-semibold text-slate-900 pb-3 mb-5 border-b border-slate-100 flex items-center">
        <i data-lucide="plus-circle" class="w-5 h-5 mr-2 text-indigo-600"></i> New Equipment Entry
      </h2>

      <form id="equipmentForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
        
        <!-- Primary Fields -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Equipment Name *</label>
            <input type="text" id="equipmentName" required placeholder="e.g. Adult Patient Simulator"
              class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Manufacturer *</label>
            <input type="text" id="manufacturer" required placeholder="e.g. Laerdal"
              class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Serial Number *</label>
            <input type="text" id="serialNumber" required placeholder="e.g. SN-994820"
              class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">ECN Tag *</label>
            <input type="text" id="ecnTag" required placeholder="e.g. ECN-2026-001"
              class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Type *</label>
            <select id="equipmentType" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              <option value="" disabled selected>Select Equipment Type</option>
              <option value="Task Trainer">Task Trainer</option>
              <option value="Patient Mannequin">Patient Mannequin</option>
              <option value="Virtual Reality">Virtual Reality</option>
              <option value="IT">IT</option>
              <option value="Biomed">Biomed</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <!-- Location Fields -->
        <div class="pt-4 border-t border-slate-100">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Location Details</label>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Building *</label>
              <input type="text" id="building" required placeholder="e.g. Health Sciences"
                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Floor *</label>
              <input type="text" id="floor" required placeholder="e.g. 3rd Floor"
                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Room *</label>
              <input type="text" id="room" required placeholder="e.g. Room 302B"
                class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end space-x-3 pt-2">
          <button type="button" onclick="document.getElementById('equipmentForm').reset()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">
            Clear
          </button>
          <button type="submit" id="submitBtn" class="px-6 py-2 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm flex items-center space-x-2">
            <i data-lucide="send" class="w-4 h-4"></i>
            <span>Submit Data</span>
          </button>
        </div>

      </form>
    </section>

    <!-- Submissions Table (Beneath Intake Form) -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-semibold text-slate-900 flex items-center">
          <i data-lucide="list" class="w-5 h-5 mr-2 text-indigo-600"></i> Recorded Submissions
        </h2>
        <span id="rowCount" class="text-xs bg-slate-100 px-2.5 py-1 rounded-full text-slate-600 font-medium">0 records</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold uppercase tracking-wider">
              <th class="p-3">Time</th>
              <th class="p-3">Equipment Name</th>
              <th class="p-3">Manufacturer</th>
              <th class="p-3">Serial #</th>
              <th class="p-3">ECN Tag</th>
              <th class="p-3">Type</th>
              <th class="p-3">Building</th>
              <th class="p-3">Floor</th>
              <th class="p-3">Room</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody" class="divide-y divide-slate-100 text-slate-700">
            <tr id="emptyRow">
              <td colspan="9" class="p-6 text-center text-slate-400 italic">Loading records from Google Sheet...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    lucide.createIcons();

    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbxjShbCKiajDIPXlUKVNtnAs-yaqbtrbxtvl66QGifW801EGERqUgpZedwOJBf5sq4a/exec";
    let gasWebAppUrl = localStorage.getItem('GAS_URL') || DEFAULT_GAS_URL;

    document.getElementById('gasUrlInput').value = gasWebAppUrl;

    // Fetch existing records on page load
    window.addEventListener('DOMContentLoaded', fetchRecords);

    async function fetchRecords() {
      try {
        const response = await fetch(gasWebAppUrl);
        const result = await response.json();
        
        if (result.status === 'success' && result.data.length > 0) {
          const tbody = document.getElementById('recordsTableBody');
          tbody.innerHTML = ''; // clear loading message
          
          result.data.forEach(record => {
            appendRowToTable(record, false);
          });
          
          updateRowCount();
        } else {
          document.getElementById('emptyRow').innerHTML = `<td colspan="9" class="p-6 text-center text-slate-400 italic">No equipment submissions recorded yet.</td>`;
        }
      } catch (err) {
        console.error('Error fetching records:', err);
        document.getElementById('emptyRow').innerHTML = `<td colspan="9" class="p-6 text-center text-red-400 italic">Failed to load records from Google Sheet.</td>`;
      }
    }

    function saveGasUrl() {
      const url = document.getElementById('gasUrlInput').value.trim();
      if (url) {
        gasWebAppUrl = url;
        localStorage.setItem('GAS_URL', url);
        document.getElementById('statusIndicator').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
        alert('Google Apps Script URL updated successfully!');
        fetchRecords();
      } else {
        localStorage.removeItem('GAS_URL');
        gasWebAppUrl = DEFAULT_GAS_URL;
        document.getElementById('gasUrlInput').value = DEFAULT_GAS_URL;
        alert('Reset to default Web App URL');
      }
    }

    async function handleFormSubmit(event) {
      event.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Saving...';

      const record = {
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        equipmentName: document.getElementById('equipmentName').value.trim(),
        manufacturer: document.getElementById('manufacturer').value.trim(),
        serialNumber: document.getElementById('serialNumber').value.trim(),
        ecnTag: document.getElementById('ecnTag').value.trim(),
        equipmentType: document.getElementById('equipmentType').value,
        building: document.getElementById('building').value.trim(),
        floor: document.getElementById('floor').value.trim(),
        room: document.getElementById('room').value.trim()
      };

      try {
        if (gasWebAppUrl) {
          await fetch(gasWebAppUrl, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(record)
          });
        }
        
        appendRowToTable(record, true);
        updateRowCount();
        document.getElementById('equipmentForm').reset();
        alert('Equipment saved successfully!');
      } catch (err) {
        alert('Error saving record: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i><span>Submit Data</span>`;
        lucide.createIcons();
      }
    }

    function appendRowToTable(data, prepend = false) {
      const emptyRow = document.getElementById('emptyRow');
      if (emptyRow) emptyRow.remove();

      const tbody = document.getElementById('recordsTableBody');
      const tr = document.createElement('tr');
      tr.className = 'hover:bg-slate-50 transition';

      tr.innerHTML = `
        <td class="p-3 text-slate-400 font-mono">${escapeHtml(data.timestamp)}</td>
        <td class="p-3 font-medium text-slate-900">${escapeHtml(data.equipmentName)}</td>
        <td class="p-3">${escapeHtml(data.manufacturer)}</td>
        <td class="p-3 font-mono">${escapeHtml(data.serialNumber)}</td>
        <td class="p-3 font-mono">${escapeHtml(data.ecnTag)}</td>
        <td class="p-3"><span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded font-medium">${escapeHtml(data.equipmentType)}</span></td>
        <td class="p-3">${escapeHtml(data.building)}</td>
        <td class="p-3">${escapeHtml(data.floor)}</td>
        <td class="p-3">${escapeHtml(data.room)}</td>
      `;

      if (prepend) {
        tbody.insertBefore(tr, tbody.firstChild);
      } else {
        tbody.appendChild(tr);
      }
    }

    function updateRowCount() {
      const tbody = document.getElementById('recordsTableBody');
      const totalRecords = tbody.querySelectorAll('tr:not(#emptyRow)').length;
      document.getElementById('rowCount').innerText = `${totalRecords} record${totalRecords === 1 ? '' : 's'}`;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
